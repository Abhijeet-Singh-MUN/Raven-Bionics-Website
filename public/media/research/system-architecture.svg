<title id="art-title">Raven Bionics experimental spatial intelligence architecture</title><desc id="art-desc">An explanatory diagram showing a simulated environment with range rays, a spatial memory with voxels and object relationships, and a heuristic attention and telemetry feedback system. Conceptual diagram, not a screenshot or validated robot deployment.</desc>
